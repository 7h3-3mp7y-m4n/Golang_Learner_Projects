<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        #chat {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            height: 80%;
        }

        #input-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        #username-container {
            margin-bottom: 20px;
            text-align: center;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            margin: 5px;
            width: 200px;
            outline: none;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            animation: fadeIn 0.6s ease-in-out;
            max-width: 80%;
            word-wrap: break-word;
        }

        .sender {
            background-color: #1d7ccf;
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 0;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .receiver {
            background-color: #e4e4e4;
            color: #333;
            align-self: flex-end;
            border-bottom-left-radius: 0;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .message p {
            margin: 0;
            padding: 0;
        }

        .ping-message {
            font-size: 0.9em;
            color: #777;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            font-style: italic;
            color: #888;
            margin-top: 10px;
        }

        #send-button {
            margin-left: 10px;
        }

        /* Custom Scrollbar */
        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background-color: #bbb;
        }
    </style>
</head>
<body>
    <div id="chat">
        <div id="username-container">
            <input type="text" id="username" placeholder="Enter your username" />
            <button onclick="setUsername()">Set Username</button>
        </div>

        <div id="messages"></div>

        <div id="input-container">
            <input type="text" id="messageInput" placeholder="Type a message..." />
            <button id="send-button" onclick="sendMessage()">Send</button>
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>
    </div>

    <script>
        let socket;
        let username;
        let isTyping = false;
        let typingTimeout;

        // Open WebSocket connection
        function connectWebSocket() {
            socket = new WebSocket("ws://localhost:8080/ws?username=" + encodeURIComponent(username));

            socket.onopen = () => {
                console.log("Connected to the server");
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                displayMessage(msg.username, msg.content, msg.username !== username ? 'receiver' : 'sender');
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
            };

            socket.onclose = () => {
                console.log("Disconnected from server");
            };

            // Respond to ping messages to keep the connection alive
            socket.onping = () => {
                socket.pong();
            };
        }

        function setUsername() {
            username = document.getElementById("username").value.trim();
            if (username && !socket) {
                connectWebSocket();
                document.getElementById("username-container").style.display = 'none';
            }
        }

        // Display message in chat
        function displayMessage(user, content, type) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", type);
            messageDiv.innerHTML = `<p><strong>${user}:</strong> ${content}</p>`;
            document.getElementById("messages").appendChild(messageDiv);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }

        // Send a message to the server
        function sendMessage() {
            const messageContent = document.getElementById("messageInput").value.trim();
            if (messageContent && socket && username) {
                const msg = {
                    username: username,
                    content: messageContent,
                    to: 'anotherUser'
                };

                socket.send(JSON.stringify(msg));
                displayMessage(username, messageContent, 'sender');
                document.getElementById("messageInput").value = '';
            }
        }

        document.getElementById("messageInput").addEventListener("input", function() {
            if (typingTimeout) clearTimeout(typingTimeout);

            if (!isTyping) {
                isTyping = true;
                document.getElementById("typing-indicator").innerText = `${username} is typing...`;
            }

            typingTimeout = setTimeout(() => {
                isTyping = false;
                document.getElementById("typing-indicator").innerText = '';
            }, 1000);
        });
    </script>
</body>
</html>
